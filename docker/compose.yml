# Integration test stack.
#
# Profiles:
#   slim — bitcoind + electrumx-default + toxiproxy. Default for CI smoke.
#   full — slim + fulcrum + electrs + strict variants. Run nightly / on-demand.
#
# Image pins are intentional — `latest` rotates and would silently break CI.
# Bump deliberately when broadening test coverage.

services:
  bitcoind:
    image: btcpayserver/bitcoin:26.0
    profiles: [slim, full]
    command:
      - bitcoind
      - -regtest
      - -server
      - -txindex=1
      - -rpcallowip=0.0.0.0/0
      - -rpcbind=0.0.0.0
      - -rpcuser=ci
      - -rpcpassword=ci
      - -fallbackfee=0.00001
    ports:
      - '18443:18443' # regtest RPC
      - '18444:18444' # regtest P2P
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'bitcoin-cli -regtest -rpcuser=ci -rpcpassword=ci getblockchaininfo > /dev/null',
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  electrumx-default:
    image: lukechilds/electrumx:latest
    profiles: [slim, full]
    depends_on:
      bitcoind:
        condition: service_healthy
    environment:
      DAEMON_URL: http://ci:ci@bitcoind:18443
      COIN: BitcoinSegwit
      NET: regtest
      SERVICES: tcp://:50001
      INITIAL_CONCURRENT: '50'
      PEER_DISCOVERY: 'self'
    ports:
      - '50001:50001' # direct lane
    healthcheck:
      # ElectrumX image is alpine-ish without bash; python3 ships with it.
      test:
        [
          'CMD',
          'python3',
          '-c',
          "import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1', 50001)); s.close()",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    profiles: [slim, full]
    depends_on:
      electrumx-default:
        condition: service_healthy
    command: ['-host=0.0.0.0', '-config=/etc/toxiproxy.json']
    volumes:
      - ./toxiproxy/config.json:/etc/toxiproxy.json:ro
    ports:
      - '8474:8474' # admin HTTP
      - '60001:60001' # electrumx-tcp lane
    healthcheck:
      test: ['CMD-SHELL', "echo > /dev/tcp/127.0.0.1/8474"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
