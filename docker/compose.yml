# Integration test stack.
#
# Profiles:
#   slim — bitcoind + electrumx-default + toxiproxy. Default for CI smoke.
#   full — slim + fulcrum + electrs + strict variants. Run nightly / on-demand.
#
# Image pins are intentional — `latest` rotates and would silently break CI.
# Bump deliberately when broadening test coverage.

services:
  bitcoind:
    image: btcpayserver/bitcoin:26.0
    profiles: [slim, full]
    command:
      - bitcoind
      - -regtest
      - -server
      - -txindex=1
      - -rpcallowip=0.0.0.0/0
      - -rpcbind=0.0.0.0
      - -rpcuser=ci
      - -rpcpassword=ci
      - -fallbackfee=0.00001
    ports:
      - '18443:18443' # regtest RPC
      - '18444:18444' # regtest P2P
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'bitcoin-cli -regtest -rpcuser=ci -rpcpassword=ci getblockchaininfo > /dev/null',
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  electrumx-default:
    # ElectrumX 1.18.0 — pinned by digest (the tag is mutable; a rotated
    # `latest` would silently change the server code CI tests against).
    # Update the digest deliberately: docker pull lukechilds/electrumx:latest
    # && docker inspect --format '{{index .RepoDigests 0}}' ...
    image: lukechilds/electrumx@sha256:c7e630b2ab68545a43907724d9e8b80b105c253ee9794bfa0658ada031a0d22d
    profiles: [slim, full]
    depends_on:
      bitcoind:
        condition: service_healthy
    environment:
      DAEMON_URL: http://ci:ci@bitcoind:18443
      COIN: BitcoinSegwit
      NET: regtest
      # ws:// is ElectrumX's native Electrum-over-WebSocket (one JSON-RPC
      # payload per message, no trailing newline) — the integration ws
      # lane. Verified in the container log: "TCP server listening" plus
      # a WS service line on 50003.
      SERVICES: tcp://:50001,ws://:50003
      INITIAL_CONCURRENT: '50'
      PEER_DISCOVERY: 'self'
    ports:
      - '50001:50001' # direct lane
      - '50003:50003' # direct ws lane (native message framing)
    healthcheck:
      # ElectrumX image is alpine-ish without bash; python3 ships with it.
      test:
        [
          'CMD',
          'python3',
          '-c',
          "import socket; [socket.create_connection(('127.0.0.1', p), timeout=2).close() for p in (50001, 50003)]",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  bitcoind-init:
    # One-shot: mines a single regtest block and creates the `ci` wallet.
    # Fulcrum's controller refuses to start while bitcoind reports
    # `getblockchaininfo.headers === 0`, so we prime the chain. Idempotent —
    # createwallet errors are tolerated and generatetoaddress only runs at
    # height 0.
    image: btcpayserver/bitcoin:26.0
    profiles: [slim, full]
    depends_on:
      bitcoind:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -e
        ARGS="-regtest -rpcconnect=bitcoind -rpcport=18443 -rpcuser=ci -rpcpassword=ci"
        bitcoin-cli $$ARGS -named createwallet wallet_name=ci 2>/dev/null || true
        bitcoin-cli $$ARGS loadwallet ci 2>/dev/null || true
        H=$$(bitcoin-cli $$ARGS getblockcount)
        if [ "$$H" = "0" ]; then
          ADDR=$$(bitcoin-cli $$ARGS getnewaddress)
          bitcoin-cli $$ARGS generatetoaddress 1 "$$ADDR" > /dev/null
        fi
        echo "init: chain at $$(bitcoin-cli $$ARGS getblockcount)"
    restart: 'no'

  fulcrum-default:
    image: cculianu/fulcrum:v1.11.1
    profiles: [slim, full]
    depends_on:
      bitcoind:
        condition: service_healthy
      bitcoind-init:
        condition: service_completed_successfully
    volumes:
      - ./fulcrum/configs/default.conf:/etc/fulcrum.conf:ro
    command: ['Fulcrum', '/etc/fulcrum.conf']
    ports:
      - '50101:50001' # direct lane (host) → 50001 (container)
      - '50103:50003' # direct ws lane (native message framing)
    healthcheck:
      # /dev/tcp is bash-only and the image's `sh` is dash. Invoke bash
      # explicitly. Probes both listeners so `up --wait` guarantees the
      # ws lane too.
      test: ['CMD', 'bash', '-c', 'echo > /dev/tcp/127.0.0.1/50001 && echo > /dev/tcp/127.0.0.1/50003']
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 15s

  fulcrum-strict:
    # Fulcrum's `max_subs_per_ip` cap (configured at its hard minimum
    # of 500) so a burst of ~501 scripthash subscribes trips
    # `RPC::Code_App_LimitExceeded` and Fulcrum replies with
    # `RpcError("Subscription limit reached")`. The default classifier
    # maps that to `rate-limit` and the manager bans the client. Used
    # by the ban-detection integration test.
    image: cculianu/fulcrum:v1.11.1
    profiles: [slim, full]
    depends_on:
      bitcoind:
        condition: service_healthy
      bitcoind-init:
        condition: service_completed_successfully
    volumes:
      - ./fulcrum/configs/strict.conf:/etc/fulcrum.conf:ro
    command: ['Fulcrum', '/etc/fulcrum.conf']
    ports:
      - '50102:50001' # strict lane
      - '50104:50003' # strict ws lane
    healthcheck:
      test: ['CMD', 'bash', '-c', 'echo > /dev/tcp/127.0.0.1/50001 && echo > /dev/tcp/127.0.0.1/50003']
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 15s

  electrs-default:
    image: getumbrel/electrs:v0.11.0
    profiles: [slim, full]
    depends_on:
      bitcoind:
        condition: service_healthy
      bitcoind-init:
        condition: service_completed_successfully
    volumes:
      - ./electrs/configs/default.toml:/data/electrs.toml:ro
    command: ['--conf=/data/electrs.toml']
    ports:
      - '50201:50001' # direct lane
    healthcheck:
      # electrs image is distroless-ish; rely on the python3 baked in to
      # the underlying base if present, else a python-less probe.
      # Actually electrs image is FROM debian:slim — /bin/sh + nc-via-bash
      # is enough.
      test: ['CMD', 'bash', '-c', 'echo > /dev/tcp/127.0.0.1/50001']
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 30s

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    profiles: [slim, full]
    depends_on:
      electrumx-default:
        condition: service_healthy
    command: ['-host=0.0.0.0', '-config=/etc/toxiproxy.json']
    volumes:
      - ./toxiproxy/config.json:/etc/toxiproxy.json:ro
    ports:
      - '8474:8474' # admin HTTP
      - '52001:52001' # electrumx-tcp lane
      - '52003:52003' # electrumx-ws lane
      - '52101:52101' # fulcrum-tcp lane
      - '52103:52103' # fulcrum-ws lane
      - '52201:52201' # electrs-tcp lane
      # 52203 (electrs-ws) stays internal — only wsbridge-electrs-int
      # dials it; the host-facing electrs ws endpoint is the bridge.
    # No healthcheck: the toxiproxy image is scratch-based and ships only
    # the `toxiproxy-server` binary — nothing to drive a `bash` / `python`
    # / `curl` probe with. No other service gates on toxiproxy; CI's `up
    # --wait` succeeds once electrumx is healthy. Tests that need the
    # admin HTTP API poll it themselves at :8474.

  wsbridge-electrs-int:
    # Integration ws lane for electrs, which has no native WebSocket:
    # the ws↔tcp byte bridge (`wsFraming: 'newline'` on the client).
    # Routed THROUGH toxiproxy (electrs-ws lane) so disabling that proxy
    # severs the ws lane end-to-end — the bridge's connect-before-upgrade
    # turns a disabled proxy into a 502 and the client's connect() fails,
    # matching what a disabled TCP lane does.
    # Bun 1.3-alpine — pinned by digest (mutable tags rotate; the slim
    # bridge is CI-critical). Bump deliberately:
    # docker pull oven/bun:1.3-alpine && docker inspect --format
    # '{{index .RepoDigests 0}}' oven/bun:1.3-alpine
    image: oven/bun@sha256:5acc90a93e91ff07bf72aa90a7c9f0fa189765aec90b47bdbf2152d2196383c0
    profiles: [slim, full]
    depends_on:
      toxiproxy:
        condition: service_started
      electrs-default:
        condition: service_healthy
    volumes:
      - ./wsbridge/bridge.ts:/app/bridge.ts:ro
    command: ['bun', '/app/bridge.ts']
    environment:
      LISTEN_PORT: '8080'
      TARGET_HOST: 'toxiproxy'
      TARGET_PORT: '52203'
    ports:
      - '50203:8080' # electrs ws lane (byte tunnel, newline framing)

  # --- demo profile: ws↔tcp bridges for the browser demo -------------------
  #
  # Browsers speak WebSocket only; the electrum servers speak TCP only.
  # One bridge per server, each targeting a dedicated `*-demo` toxiproxy
  # lane (see toxiproxy/config.json) so UI-injected toxics never touch
  # the integration-test lanes. Run with:
  #   docker compose -f docker/compose.yml --profile slim --profile demo up -d --wait
  # See ../examples/demo for the app (`pnpm demo`).

  wsbridge-electrumx:
    # Bun 1.3-alpine — pinned by digest (mutable tags rotate; the slim
    # bridge is CI-critical). Bump deliberately:
    # docker pull oven/bun:1.3-alpine && docker inspect --format
    # '{{index .RepoDigests 0}}' oven/bun:1.3-alpine
    image: oven/bun@sha256:5acc90a93e91ff07bf72aa90a7c9f0fa189765aec90b47bdbf2152d2196383c0
    profiles: [demo]
    depends_on:
      - toxiproxy
    volumes:
      - ./wsbridge/bridge.ts:/app/bridge.ts:ro
    command: ['bun', '/app/bridge.ts']
    environment:
      LISTEN_PORT: '8080'
      TARGET_HOST: 'toxiproxy'
      TARGET_PORT: '52011'
    ports:
      - '52002:8080'

  wsbridge-fulcrum:
    # Bun 1.3-alpine — pinned by digest (mutable tags rotate; the slim
    # bridge is CI-critical). Bump deliberately:
    # docker pull oven/bun:1.3-alpine && docker inspect --format
    # '{{index .RepoDigests 0}}' oven/bun:1.3-alpine
    image: oven/bun@sha256:5acc90a93e91ff07bf72aa90a7c9f0fa189765aec90b47bdbf2152d2196383c0
    profiles: [demo]
    depends_on:
      - toxiproxy
    volumes:
      - ./wsbridge/bridge.ts:/app/bridge.ts:ro
    command: ['bun', '/app/bridge.ts']
    environment:
      LISTEN_PORT: '8080'
      TARGET_HOST: 'toxiproxy'
      TARGET_PORT: '52111'
    ports:
      - '52102:8080'

  wsbridge-electrs:
    # Bun 1.3-alpine — pinned by digest (mutable tags rotate; the slim
    # bridge is CI-critical). Bump deliberately:
    # docker pull oven/bun:1.3-alpine && docker inspect --format
    # '{{index .RepoDigests 0}}' oven/bun:1.3-alpine
    image: oven/bun@sha256:5acc90a93e91ff07bf72aa90a7c9f0fa189765aec90b47bdbf2152d2196383c0
    profiles: [demo]
    depends_on:
      - toxiproxy
    volumes:
      - ./wsbridge/bridge.ts:/app/bridge.ts:ro
    command: ['bun', '/app/bridge.ts']
    environment:
      LISTEN_PORT: '8080'
      TARGET_HOST: 'toxiproxy'
      TARGET_PORT: '52211'
    ports:
      - '52202:8080'
