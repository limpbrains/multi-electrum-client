# Fulcrum strict config — tight limits to make rate-limit / ban detection trivial to test.
datadir = /data
bitcoind = bitcoind:18443
rpcuser = ci
rpcpassword = ci
tcp = 0.0.0.0:50001
ssl = 0.0.0.0:50004
peering = false
announce = false
max_clients_per_ip = 1
workqueue = 4
max_pending_connections = 4
