# Fulcrum strict config — `max_subs_per_ip = 500` (Fulcrum's hard
# minimum) so a burst of ~501 scripthash subscribes from a single IP
# trips `RPC::Code_App_LimitExceeded`. Fulcrum replies with
# `RpcError("Subscription limit reached")` per `src/Servers.cpp`
# (`impl_generic_subscribe`); the manager's default classifier maps
# that string to `rate-limit` → ban. Used by ban-detection.
#
# Going below 500 isn't possible — Fulcrum refuses to start.
datadir = /data
bitcoind = bitcoind:18443
rpcuser = ci
rpcpassword = ci
tcp = 0.0.0.0:50001
ws = 0.0.0.0:50003
peering = false
announce = false
max_subs_per_ip = 500
max_subs = 5000
