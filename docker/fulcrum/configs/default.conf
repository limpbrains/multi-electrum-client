# Fulcrum default config for the integration stack.
#
# - bitcoind = host:port matches the compose service name.
# - rpccookie left empty; we use rpcuser/rpcpassword (must match
#   bitcoind's command-line args in compose.yml).
# - tcp + plaintext ws listeners — TLS (ssl/wss) would need a cert
#   dance that's out of scope for the slim profile. `ws` is Fulcrum's
#   native Electrum-over-WebSocket: one complete JSON-RPC payload per
#   message, no trailing newline (the library's `wsFraming: 'message'`).
# - peering / announce off because regtest doesn't have peers.

datadir = /data
bitcoind = bitcoind:18443
rpcuser = ci
rpcpassword = ci
tcp = 0.0.0.0:50001
ws = 0.0.0.0:50003
peering = false
announce = false
