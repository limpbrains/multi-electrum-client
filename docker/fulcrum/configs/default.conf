# Fulcrum default config for the integration stack.
#
# - bitcoind = host:port matches the compose service name.
# - rpccookie left empty; we use rpcuser/rpcpassword (must match
#   bitcoind's command-line args in compose.yml).
# - tcp listener only — TLS would need a cert dance that's out of
#   scope for the slim profile.
# - peering / announce off because regtest doesn't have peers.

datadir = /data
bitcoind = bitcoind:18443
rpcuser = ci
rpcpassword = ci
tcp = 0.0.0.0:50001
peering = false
announce = false
