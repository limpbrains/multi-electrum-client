name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  rn-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    # On-device run of the unit suite (Android emulator via react-native-harness).
    # Parallel to integration; does not gate build.
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C test/rn/app install
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Android app
        run: cd test/rn/app/android && ./gradlew assembleDebug
      # Pin the action to the newest published tag; the npm packages in
      # test/rn/app are pinned to 1.3.0 (no matching action tag exists yet).
      # NOTE: `app` is resolved relative to projectRoot by the action.
      - uses: callstackincubator/react-native-harness@v1.2.0
        env:
          # Metro inside the harness CLI keeps every per-test-file bundle
          # graph in one node process; the default ~2 GB V8 heap is not
          # enough for 26+7 suites.
          NODE_OPTIONS: --max-old-space-size=3072
        with:
          runner: android
          app: android/app/build/outputs/apk/debug/app-debug.apk
          projectRoot: test/rn/app
          packageManager: pnpm
          cacheAvd: true
      # Boot the docker stack only now: the 7 GB runner hosts the emulator,
      # gradle, and the compose stack; keeping them all alive for the whole
      # job risks the OOM killer taking out containers mid-run.
      - name: boot integration stack
        run: docker compose -f docker/compose.yml --profile slim up -d --wait
      - name: stack health snapshot
        run: |
          free -h
          docker compose -f docker/compose.yml --profile slim ps
          curl -sf http://127.0.0.1:8474/proxies > /dev/null && echo "toxiproxy reachable"
      # Second pass on the same emulator: the integration suite against the
      # docker stack (the app reaches host ports via 10.0.2.2).
      - uses: callstackincubator/react-native-harness@v1.2.0
        env:
          NODE_OPTIONS: --max-old-space-size=3072
        with:
          runner: android
          app: android/app/build/outputs/apk/debug/app-debug.apk
          projectRoot: test/rn/app
          packageManager: pnpm
          cacheAvd: true
          harnessArgs: '-c jest.harness.integration.config.mjs'
      - name: dump stack state on failure
        if: failure()
        run: |
          free -h
          docker compose -f docker/compose.yml --profile slim ps -a
          docker compose -f docker/compose.yml --profile slim logs --no-color --tail 50
          sudo dmesg | grep -iE "oom|killed process" | tail -20 || true
      - name: tear down integration stack
        if: always()
        run: docker compose -f docker/compose.yml --profile slim down -v
      - name: Upload harness logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-logs-rn-android
          path: test/rn/app/.harness/logs
          if-no-files-found: ignore

  rn-ios:
    runs-on: macos-15
    timeout-minutes: 45
    # On-device run of the unit suite (iOS simulator via react-native-harness).
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C test/rn/app install
      - name: CocoaPods cache
        uses: actions/cache@v4
        with:
          path: |
            test/rn/app/ios/Pods
            ~/Library/Caches/CocoaPods
          key: rn-harness-pods-${{ runner.os }}-${{ hashFiles('test/rn/app/ios/Podfile.lock') }}
          restore-keys: rn-harness-pods-${{ runner.os }}-
      - name: Install pods
        run: cd test/rn/app/ios && pod install
      - name: Pick an available simulator
        # Device pins in rn-harness.config.mjs default to iPhone 16 / iOS 18.x;
        # resolve whatever the runner image actually ships so image updates
        # don't break the job.
        run: |
          xcrun simctl list runtimes iOS
          RUNTIME=$(xcrun simctl list runtimes iOS -j | python3 -c "import json,sys; rs=[r for r in json.load(sys.stdin)['runtimes'] if r['isAvailable']]; print(rs[-1]['version'])")
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          data=json.load(sys.stdin)['devices']
          names=[d['name'] for ds in data.values() for d in ds if d['name'].startswith('iPhone')]
          print(sorted(names)[-1])")
          echo "HARNESS_IOS_SIM=$DEVICE" >> "$GITHUB_ENV"
          echo "HARNESS_IOS_VERSION=$RUNTIME" >> "$GITHUB_ENV"
          echo "Using $DEVICE on iOS $RUNTIME"
      - name: Build iOS app
        # NOTE: build-ios resolves --buildFolder relative to the ios/
        # directory, so ./build lands at test/rn/app/ios/build.
        run: cd test/rn/app && npx react-native build-ios --mode Debug --buildFolder ./build
      # NOTE: `app` is resolved relative to projectRoot by the action.
      - uses: callstackincubator/react-native-harness@v1.2.0
        env:
          # Metro inside the harness CLI keeps every per-test-file bundle
          # graph in one node process; the default ~2 GB V8 heap OOMs
          # after ~22 of 26 suites.
          NODE_OPTIONS: --max-old-space-size=4096
        with:
          runner: ios
          app: ios/build/Build/Products/Debug-iphonesimulator/HarnessApp.app
          projectRoot: test/rn/app
          packageManager: pnpm
      - name: Upload harness logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-logs-rn-ios
          path: test/rn/app/.harness/logs
          if-no-files-found: ignore

  integration:
    runs-on: ubuntu-latest
    # Real Docker stack — slower than unit; run in parallel with the rest
    # so PR feedback isn't blocked on it.
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: boot integration stack
        run: docker compose -f docker/compose.yml --profile slim up -d --wait
      - name: integration tests
        run: pnpm test:integration
      - name: dump logs on failure
        if: failure()
        run: docker compose -f docker/compose.yml --profile slim logs --no-color
      - name: tear down
        if: always()
        run: docker compose -f docker/compose.yml --profile slim down -v
