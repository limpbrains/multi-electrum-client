<!doctype html>
<!--
  Browser example.

  This file is meant to be served through a bundler (vite, webpack, esbuild,
  etc.) that resolves the `multi-electrum-client` bare specifier and respects
  the package's `browser` conditional export. Quick path:

    pnpm add multi-electrum-client
    pnpm create vite@latest .       # then drop this file in as index.html
    pnpm vite

  If you want to run the file directly without a bundler — e.g. for a quick
  experiment served from a local static server — add an import map that
  points the bare specifier at a CDN that serves the package's browser
  build. The block below is commented out by default; uncomment and replace
  `<VERSION>` with the version you want.

  <script type="importmap">
    {
      "imports": {
        "multi-electrum-client": "https://esm.sh/multi-electrum-client@<VERSION>?bundle"
      }
    }
  </script>

  Without one of these two paths, the browser will reject the bare
  specifier with "Failed to resolve module specifier 'multi-electrum-client'".
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>multi-electrum-client — browser example</title>
  </head>
  <body>
    <pre id="out"></pre>
    <script type="module">
      import { ElectrumManager, failover } from 'multi-electrum-client';

      const out = document.getElementById('out');
      const log = (...args) => {
        out.textContent += args.join(' ') + '\n';
      };

      const manager = new ElectrumManager({
        network: 'mainnet',
        servers: [
          // Browsers can only reach servers exposing a wss endpoint.
          { id: 'a', host: 'electrum.example.org', port: 50004, protocol: 'wss' },
        ],
        policy: failover(['a']),
      });
      manager.on('client-state', (e) => log('[state]', e.clientId, '→', e.state));
      manager.on('error', (e) => log('[error]', e));

      await manager.start();
      const tip = await manager.headers.getTip();
      log('tip:', JSON.stringify(tip));

      // Suspend on tab hide, resume on visible — common browser pattern.
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) manager.suspend();
        else manager.resume();
      });
    </script>
  </body>
</html>
